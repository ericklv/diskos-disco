# Publishes verified prepared firmware for a version tag or a version bump on main.
# The matching tag is created only after packaging succeeds. The ready-built interface (payload/mq_ui)
# plus the standalone apps, the Windows app, complete ZIP and checksums as downloads, with the notes from docs/releases/<tag>.md. Push a tag and the release appears.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths: ["ui/version.h", "payload/mq_ui.build.json"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(python3 -c 'import re; from pathlib import Path; print("v" + re.search(r"#define DISCO_VERSION\s+\"([^\"]+)\"", Path("ui/version.h").read_text())[1])')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "Tag and visible version disagree" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            git merge-base --is-ancestor "refs/tags/$TAG" "$GITHUB_SHA" || {
              echo "Existing release must be an ancestor of its replacement" >&2
              exit 1
            }
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag, source and prepared firmware
        run: python3 tools/check-release.py --tag "${{ steps.version.outputs.tag }}"

      - name: Build the Windows app and its Linux environment
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y mono-devel debootstrap
          sh windows/build.sh
          sudo sh windows/wsl/build-env.sh
          sudo chown -R "$(id -u):$(id -g)" windows/out vendor

      - name: Collect the release files
        run: |
          set -e
          python3 tools/package-release.py
          cat dist/SHA256SUMS dist/MD5SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e
          if [ "$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)" != "$GITHUB_SHA" ]; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
          fi
          NOTES="docs/releases/${TAG}.md"
          [ -f "$NOTES" ] || NOTES="CHANGELOG.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "diskOS Disco! ${TAG#v}" --notes-file "$NOTES" --latest
          else
            gh release create "$TAG" dist/* \
              --title "diskOS Disco! ${TAG#v}" --notes-file "$NOTES" --latest
          fi
